name: Isolated C107 historical PostgreSQL gate
'on':
  push:
    branches: [main, 'validation/c107-history-20261007']
permissions:
  contents: read
concurrency:
  group: history-${{ github.ref }}
  cancel-in-progress: true
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: c107_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d c107_test_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DALA_C107_DISPOSABLE: '1'
      DALA_C107_EXPECT_DATABASE: c107_test_ci
      DALA_C107_DATABASE_URL: postgresql://postgres:ephemeral-ci-only@127.0.0.1:5432/c107_test_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12.15'}
      - name: Install pinned current application dependencies
        run: python -m pip install -r backend/requirements-dev.lock && python -m pip check
      - name: Verify exact pinned source and four-file schema fixture
        run: python ops/run_c107_history_tests.py --check-inputs
      - name: Eight actual historical-import PostgreSQL cases, zero skips
        run: python ops/run_c107_history_tests.py
