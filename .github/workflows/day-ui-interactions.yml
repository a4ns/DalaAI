name: Focused synthetic native component interactions
'on':
  push:
    branches: [validation/day-ui-interactions-20261008]
permissions:
  contents: read
concurrency:
  group: day-ui-interactions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused-interactions:
    if: github.ref == 'refs/heads/validation/day-ui-interactions-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cbc8fd64764a7dcb8fe0dc45e2f8ce737fe0a3a9
          path: .ci-interactions
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify exact fixture and single-project matrix
        run: |
          python ops/ci/day_ui_interactions_tests.py
          node --check ops/ci/day_ui_interactions_playwright.cjs
          python ops/ci/day_ui_interactions_gate.py --source .ci-interactions --check-inputs
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/dalaai-interactions-chromium\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked frontend and official Chromium
        timeout-minutes: 10
        run: |
          npm ci --prefix .ci-interactions/frontend
          node .ci-interactions/frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run exact18-case native interaction matrix once
        run: python ops/ci/day_ui_interactions_gate.py --source .ci-interactions
      - name: Record focused synthetic scope
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('day-ui-interactions-summary.json')
          r=json.loads(p.read_text()) if p.is_file() else {}
          status=r.get('status','BLOCKED')
          if status not in {'PASS_SYNTHETIC_COMPONENT_INTERACTIONS_ONLY','FAIL','BLOCKED'}:status='BLOCKED'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Focused native component interactions: '+status+'\n\n')
              out.write('One Chromium project, six cases at each of three viewports. Synthetic callbacks and generated images.\n')
              out.write('No actual API/DB/provider, physical-device, original C or later-product acceptance claim.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: focused-interactions-${{ github.sha }}-${{ github.run_attempt }}
          path: day-ui-interactions-summary.json
          if-no-files-found: ignore
          retention-days: 7
