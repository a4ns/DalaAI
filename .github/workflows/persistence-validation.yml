name: PostgreSQL persistence validation
'on':
  push:
    branches: ['main', 'pod-a/A-009-persistence-runtime', 'pod-a/A-010-reference-key-hardening', 'pod-a/A-011-discovery-runtime', 'pod-a/A-012-session-runtime', 'pod-a/A-013-mounted-runtime', 'pod-a/A-014-events-runtime', 'pod-a/A-016-photo-runtime']
permissions:
  contents: read
concurrency:
  group: persistence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: dalaai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d dalaai_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      # Disposable CI service only, never a production credential/database.
      DALA_TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci-only@127.0.0.1:5432/dalaai_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements-dev.lock && python -m pip check
      - name: Mandatory frozen real-PostgreSQL gate
        shell: bash
        run: |
          set -euo pipefail
          scripts/run_postgres_tests.sh 2>&1 | tee postgres-gate.log
          python - <<'PY'
          import pathlib, re
          log = pathlib.Path('postgres-gate.log').read_text()
          count = re.search(r'Ran (\d+) tests? in', log)
          assert count and int(count.group(1)) == 24, 'Expected all 24 real PostgreSQL cases'
          assert not re.search(r'\bskipped\b', log), 'Skipped tests cannot satisfy acceptance'
          print('PASS: 24 real PostgreSQL tests, zero skips')
          PY
      - name: Reproduce old gap and verify populated-schema forward fix
        run: python scripts/probe_reference_key_hardening.py
      - name: Non-owner application-role gate
        shell: bash
        run: |
          set -euo pipefail
          scripts/run_postgres_role_tests.sh 2>&1 | tee postgres-role-gate.log
          python - <<'PYCODE'
          import pathlib, re
          log = pathlib.Path('postgres-role-gate.log').read_text()
          count = re.search(r'Ran (\d+) tests? in', log)
          assert count and int(count.group(1)) == 33, 'Expected 24 inherited cases plus 9 role/security checks'
          assert not re.search(r'\bskipped\b', log), 'Skipped role tests cannot satisfy acceptance'
          print('PASS: 33 application-role cases, zero skips')
          PYCODE
      - name: Discovery author PostgreSQL gate
        run: scripts/run_discovery_postgres_tests.sh
      - name: Independent discovery PostgreSQL gate
        run: python ops/run_discovery_review.py
      - name: Restricted-login discovery PostgreSQL gate
        run: python ops/run_discovery_role.py
      - name: Session author gate, 28 local and 16 real PostgreSQL cases
        shell: bash
        run: |
          set -euo pipefail
          scripts/run_session_tests.sh 2>&1 | tee session-gate.log
          python - <<'PYCODE'
          import pathlib, re
          log = pathlib.Path('session-gate.log').read_text()
          count = re.search(r'Ran (\d+) tests? in', log)
          assert count and int(count.group(1)) == 44, 'Expected 28 local plus 16 real PostgreSQL cases'
          assert not re.search(r'\bskipped\b', log), 'No session skips allowed'
          print('PASS: 44 session cases, zero skips')
          PYCODE
      - name: Independent four-case adversarial session PostgreSQL gate
        run: DALA_SESSION_CANDIDATE="$PWD" bash backend/review/sessions/run_pg_adversarial.sh
      - name: Restricted-login session PostgreSQL gate
        run: python ops/run_session_role.py
      - name: Frozen harness safety checks
        run: PYTHONPATH=backend:backend/acceptance python -m unittest discover -s backend/acceptance/tests -v
      - name: Real component HTTP lifecycle and process-restart gate
        run: python ops/run_vertical_acceptance.py
      - name: Independent mounted runtime security review probes
        run: PYTHONPATH=backend python backend/review/mounted/test_mounted_security.py
      - name: Actual mounted runtime and non-owner startup guards
        run: python ops/run_mounted_runtime_tests.py
      - name: Actual app.main non-owner lifecycle and process restart
        run: python ops/run_actual_runtime_acceptance.py
      - name: Events independent local boundary probes
        run: PYTHONPATH=backend python backend/review/events/probes/test_independent_events.py
      - name: Events author PostgreSQL gate
        run: scripts/run_order_events_postgres_tests.sh
      - name: Events independent PostgreSQL gate
        run: python ops/run_events_review.py
      - name: Restricted-login events PostgreSQL gate
        run: python ops/run_events_role.py
      - name: Events HTTP lifecycle and process restart
        run: python ops/run_events_acceptance.py
      - name: Photo author PostgreSQL gate
        run: scripts/run_photo_postgres_tests.sh
      - name: Independent photo lock races
        run: DALA_PHOTO_CANDIDATE="$PWD" bash backend/review/photos/run_pg_races.sh
      - name: Restricted-login photo PostgreSQL gate
        run: python ops/run_photos_role.py
      - name: Actual mounted physical-photo closure integrity
        run: python ops/run_photo_closure_tests.py
      - name: Aggregate with real PostgreSQL configured
        run: make check
