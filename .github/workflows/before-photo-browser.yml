name: Executor before-photo synthetic mounted acceptance
'on':
  push:
    branches: [validation/before-photo-browser-20261008]
permissions:
  contents: read
concurrency:
  group: before-photo-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  before-photo-android:
    if: github.ref == 'refs/heads/validation/before-photo-browser-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bbe897514e58a4b8f8b6d4f580e5273e34cb5c75
          path: .ci-before-photo
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify exact source binding and safe evidence projection
        run: |
          python ops/ci/before_photo_tests.py
          node --check ops/ci/before_photo_playwright.cjs
          python ops/ci/before_photo_gate.py --source .ci-before-photo --check-inputs
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/dalaai-before-photo-chromium\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked frontend and official Chromium
        timeout-minutes: 10
        run: |
          npm ci --prefix .ci-before-photo/frontend
          node .ci-before-photo/frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run twenty-one source and eight mounted Android-emulation cases once
        run: python ops/ci/before_photo_gate.py --source .ci-before-photo
      - name: Record synthetic before-photo scope
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('before-photo-summary.json')
          r=json.loads(p.read_text()) if p.is_file() else {}
          status=r.get('status','BLOCKED')
          if status not in {'PASS_SYNTHETIC_MOUNTED_BEFORE_PHOTO_ONLY','FAIL','BLOCKED'}:status='BLOCKED'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('Executor before-photo mounted browser acceptance: '+status+'\n\n')
              out.write('Twenty-one source cases and eight mounted App cases with Pixel 9 Android emulation, synthetic intercepted HTTP and PNG bytes.\n')
              out.write('No backend authorization, persisted attachment, physical-device, provider or original C acceptance claim.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: before-photo-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: before-photo-summary.json
          if-no-files-found: ignore
          retention-days: 7
