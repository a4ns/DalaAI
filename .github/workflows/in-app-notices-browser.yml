name: In-app notice and polling command browser acceptance
'on':
  push:
    branches: [validation/in-app-notices-browser-20261008]
permissions:
  contents: read
concurrency:
  group: in-app-notices-browser-${{ github.ref }}
  cancel-in-progress: false
jobs:
  in-app-notices-chromium:
    if: github.ref == 'refs/heads/validation/in-app-notices-browser-20261008'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8e8087103821b6334ba8d5de0a40c91ee58276f9
          path: .ci-in-app-notices
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify exact source binding and safe evidence projection
        run: |
          python ops/ci/in_app_notice_tests.py
          node --check ops/ci/in_app_notice_playwright.cjs
          python ops/ci/in_app_notice_gate.py --source .ci-in-app-notices --check-inputs
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s/dalaai-in-app-notices-chromium\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install locked frontend and official Chromium
        timeout-minutes: 10
        run: |
          npm ci --prefix .ci-in-app-notices/frontend
          node .ci-in-app-notices/frontend/node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Run exact18 mounted Chromium cases once
        run: python ops/ci/in_app_notice_gate.py --source .ci-in-app-notices
      - name: Record synthetic in-app-notices scope
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('in-app-notice-summary.json')
          r=json.loads(p.read_text()) if p.is_file() else {}
          status=r.get('status','BLOCKED')
          if status not in {'PASS_SYNTHETIC_MOUNTED_IN_APP_NOTICE_ONLY','FAIL','BLOCKED'}:status='BLOCKED'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('In-app notice mounted browser acceptance: '+status+'\n\n')
              out.write('Exact11 notice and7 polling cases with desktop Chromium and synthetic intercepted HTTP. One authored notice case uses360x732; default390x844.\n')
              out.write('No real backend authorization, physical-device, provider or original C acceptance claim.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: in-app-notices-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: in-app-notice-summary.json
          if-no-files-found: ignore
          retention-days: 7
