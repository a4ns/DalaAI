name: Composed HTTPS photo cycle
'on':
  push:
    branches: [main, 'pod-a/**']
permissions:
  contents: read
concurrency:
  group: compose-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12.15'}
      - name: Bootstrap safety and frozen provisioning input checks
        run: |
          python -m pip install -r backend/requirements-dev.lock
          python -m unittest discover -s ops/demo/tests -v
          python -m unittest discover -s ops/provision/tests -p test_demo_inputs.py -v
      - name: Start disposable loopback-only full Compose
        run: ops/demo/run.sh
      - name: Retrieve only the public local CA certificate
        run: |
          for attempt in $(seq 1 30); do
            if docker compose --env-file ops/demo/.local/env -f ops/demo/compose.yaml cp web:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/dalaai-local-ca.crt"; then break; fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/dalaai-local-ca.crt"
      - name: Verify trusted HTTPS and actual two-role photo cycle
        run: >-
          python ops/demo/smoke_https.py --base-url https://localhost:8443
          --ca-file "$RUNNER_TEMP/dalaai-local-ca.crt" --secrets ops/demo/.local
          --report compose-demo-summary.json --source-sha "$GITHUB_SHA" --expect-rules-worker
      - name: Repeat startup without migration, grants or account reset
        run: ops/demo/run.sh
      - name: Stop disposable services
        if: always()
        run: |
          if [ -f ops/demo/.local/env ]; then
            docker compose --env-file ops/demo/.local/env --env-file ops/demo/.local/workers.env -f ops/demo/compose.yaml -f ops/demo/compose.workers.yaml down
          fi
