name: Frontend source and build
'on':
  push:
    branches: [main, 'pod-a/**']
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx tsc -p tests/tsconfig.json
      - name: Independent source tests (no browser/API claim)
        run: UI_TEST_NO_SERVER=1 UI_REVIEW_SHA="$GITHUB_SHA" npm run test:ui -- --project independent-source
