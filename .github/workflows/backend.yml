name: Backend scaffold
'on':
  push:
    branches: [main, 'pod-a/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.15'
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install renderer test fonts from official Ubuntu package
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-dejavu-core
          test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          test -r /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - name: Install exact dependencies
        run: python -m pip install -r backend/requirements-dev.lock && python -m pip check
      - name: Unit, HTTP, syntax and offline proposal checks
        run: make check
      - name: Build and start real PostgreSQL and API
        run: make dev
      - name: Verify readiness, outage and recovery
        run: |
          make smoke
          docker compose --env-file .env -f ops/compose.yaml stop db
          make smoke-unready
          docker compose --env-file .env -f ops/compose.yaml start db
          make smoke
      - name: Stop containers, preserving data
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f ops/compose.yaml down
          fi
