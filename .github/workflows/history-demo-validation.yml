name: Historical and live demo fixture
'on':
  push:
    branches: [main, 'validation/history-demo-20261007']
permissions:
  contents: read
concurrency:
  group: history-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  history-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_DB: dalaai_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d dalaai_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DALA_ACCEPTANCE_DISPOSABLE: '1'
      DALA_TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci-only@127.0.0.1:5432/dalaai_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12.15'}
      - name: Install pinned dependencies
        run: python -m pip install -r backend/requirements-dev.lock && python -m pip check
      - name: Offline fixture input contracts
        run: PYTHONPATH=backend:ops/provision python -m unittest discover -s ops/provision/tests -p test_history_demo_inputs.py -v
      - name: Ten real historical/live/report PostgreSQL cases, zero skips
        run: python ops/run_history_demo_tests.py --with-reports
      - name: Three-login fixture-mode binding and completion barrier
        run: python ops/run_history_bootstrap_tests.py
