      - provider_receipt
      description: Internal worker interface only, not a public endpoint or evidence of device delivery. Provider
        and channel await A3/A0 approval.
  responses:
    Error400:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error401:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error403:
      description: Not authorized or CSRF/origin rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error404:
      description: Object does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error409:
      description: Version, transition, idempotency, completeness, or assignment conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error422:
      description: Semantically invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Error429:
      description: Rate limited; Retry-After header
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Real seconds until retry
    Error503:
      description: Temporary failure; never a success receipt
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Real seconds until retry
